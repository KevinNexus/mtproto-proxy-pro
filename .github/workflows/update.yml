name: Update proxies

on:
  push:
    branches:
      - main
    paths:
      - "worker.js"
      - "wrangler.jsonc"
      - "docs/**"
      - "sources.txt"
      - ".github/workflows/update.yml"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-proxy-deploy
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false

      - name: Cache GeoIP dataset
        uses: actions/cache@v4
        with:
          path: data
          key: geoip-dbip-country-v1

      - name: Restore uptime history
        uses: actions/cache@v4
        with:
          path: .state
          key: uptime-state-${{ github.run_id }}
          restore-keys: |
            uptime-state-

      - name: Build
        run: go build -o tgproxy ./cmd/tgproxy

      - name: Generate proxies outside public website
        run: |
          mkdir -p tmp-proxies
          ./tgproxy \
            --concurrency 250 \
            --timeout 6s \
            --reach \
            --reach-sample 60 \
            --out tmp-proxies \
            --docs tmp-proxies

      - name: Upload proxy JSON to private KV
        run: |
          npx --yes wrangler@3.90.0 kv key put "proxies.json" \
            --namespace-id="229209635b8c42e6856ac722a3111c2a" \
            --path="tmp-proxies/proxies.json"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Cloudflare Worker and website
        run: npx --yes wrangler@3.90.0 deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
