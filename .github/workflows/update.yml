name: Update proxies

# Builds the verified proxy lists and deploys them to GitHub Pages
# and Cloudflare Workers.

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours
  workflow_dispatch: # manual run button
  push:
    branches: [main]
    paths:
      - "cmd/**"
      - "internal/**"
      - "sources.txt"
      - "docs/**"
      - "wrangler.jsonc"
      - ".github/workflows/update.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false

      - name: Cache GeoIP dataset
        uses: actions/cache@v4
        with:
          path: data
          key: geoip-dbip-country-v1

      - name: Restore uptime history
        uses: actions/cache@v4
        with:
          path: .state
          key: uptime-state-${{ github.run_id }}
          restore-keys: |
            uptime-state-

      - name: Build
        run: go build -o tgproxy ./cmd/tgproxy

      - name: Generate lists (+ in-country reachability)
        run: ./tgproxy --concurrency 250 --timeout 6s --reach --reach-sample 60 --out docs --docs docs

      - name: Refresh sitemap lastmod
        run: |
          today="$(date -u +%F)"
          sed -i -E "s#<lastmod>[^<]*</lastmod>#<lastmod>${today}</lastmod>#" docs/sitemap.xml

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Deploy to Cloudflare Workers
        run: npx --yes wrangler@3.90.0 deploy 
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
